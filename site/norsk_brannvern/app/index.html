<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Norsk Brannvern – app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ED1C24;
    --red-dark:#B01319;
    --ink:#333333;
    --ink-soft:#767676;
    --paper:#F5F5F5;
    --card:#FFFFFF;
    --line:#E2E2E2;
    --green:#2F7A4E;
    --green-bg:#E7F1E9;
    --amber:#B4790F;
    --amber-bg:#FBF1DF;
    --grey:#767676;
    --grey-bg:#EFEFEF;
    --navy:#00205B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:#DEDBD3;
    display:flex;
    justify-content:center;
    padding:24px 12px;
    min-height:100vh;
  }
  h1,h2,.display{font-family:'Barlow Semi Condensed','Inter',sans-serif;}
  .phone{
    position:relative;
    width:100%;
    max-width:400px;
    min-height:700px;
    background:var(--paper);
    border-radius:26px;
    border:1px solid var(--line);
    padding:20px;
    overflow:hidden;
  }
  button{font-family:inherit;}
  .press:active{transform:scale(0.97);}
  input[type="date"], input[type="text"]{
    width:100%;
    box-sizing:border-box;
    padding:9px 10px;
    border-radius:9px;
    border:1px solid var(--line);
    font-size:14.5px;
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
  }
  .field-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field{display:block;margin-bottom:12px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .pill{
    display:inline-flex;align-items:center;gap:4px;
    font-size:12px;font-weight:600;padding:3px 9px;border-radius:100px;
    white-space:nowrap;
  }
  .icon-box{
    width:40px;height:40px;border-radius:11px;background:var(--paper);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .feature-row{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;cursor:pointer;margin-bottom:10px;
  }
  .feature-row .title{font-size:15px;font-weight:700;}
  .feature-row .subtitle{font-size:12.5px;color:var(--ink-soft);}
  .feature-row-accent{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:var(--navy);border:1px solid var(--navy);border-radius:14px;
    padding:13px 14px;cursor:pointer;margin-bottom:10px;
  }
  .feature-row-accent .title{font-size:15px;font-weight:700;color:#fff;}
  .feature-row-accent .subtitle{font-size:12.5px;color:rgba(255,255,255,0.75);}
  .feature-row-accent .icon-box{background:rgba(255,255,255,0.16);color:#fff;}
  .toggle3{display:flex;gap:8px;}
  .toggle3 button{
    flex:1;padding:9px 8px;border-radius:10px;cursor:pointer;
    font-size:13.5px;font-weight:600;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);
  }
  .toggle3 button.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(27,26,23,0.55);
    display:none;align-items:flex-end;justify-content:center;z-index:30;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%;max-width:400px;background:var(--paper);border-radius:22px 22px 0 0;
    padding:22px 20px 26px;box-sizing:border-box;
  }
  .drag-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 18px;}
  .icon-btn{
    display:flex;align-items:center;justify-content:center;
    border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;
  }
  .section-header{display:flex;align-items:center;gap:8px;margin-bottom:18px;}
  .section-header h2{font-size:21px;font-weight:700;margin:0;}
  .eyebrow{font-size:12.5px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;}
  .order-card{
    display:flex;align-items:center;justify-content:space-between;text-decoration:none;
    background:var(--amber-bg);border:1px solid #E9CE9A;border-radius:12px;padding:13px 14px;margin-top:4px;
  }
  .order-card span{font-size:14px;font-weight:600;color:#7A5209;}
  .onboard-option{
    display:flex;align-items:center;gap:12px;text-align:left;
    padding:13px 14px;border-radius:13px;border:1px solid var(--line);
    background:var(--card);cursor:pointer;width:100%;margin-bottom:10px;
  }
  .onboard-option .label{font-size:15px;font-weight:700;}
  .onboard-option .desc{font-size:12.5px;color:var(--ink-soft);}
  .hidden{display:none !important;}
  .subview{padding-top:16px;}
  .dashed-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    border:1px dashed var(--line);border-radius:13px;padding:13px;background:transparent;
    cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-soft);
  }
  .detector-name{
    flex:1;font-size:15px;font-weight:700;border:none;border-bottom:1px dashed var(--line);
    outline:none;background:transparent;padding:0 0 4px 0;color:var(--ink);
  }
  .detector-name:focus{border-bottom:1px solid var(--ink);}
  .link-btn{background:transparent;border:none;cursor:pointer;padding:0;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-decoration:underline;margin-bottom:10px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin 0.8s linear infinite;}
</style>
</head>
<body>

<div class="phone" id="phone">

  <div style="background:#FFD100;margin:-20px -20px 0 -20px;padding:6px 20px;border-radius:26px 26px 0 0;text-align:center;">
    <span style="font-size:11px;font-weight:800;letter-spacing:1.5px;color:#000;">PROTOTYPE</span>
  </div>

  <div id="view-home"></div>
  <div id="view-smoke" class="hidden subview"></div>
  <div id="view-powder" class="hidden subview"></div>
  <div id="view-blanket" class="hidden subview"></div>
  <div id="view-foam" class="hidden subview"></div>
  <div id="view-tips" class="hidden subview"></div>
  <div id="view-common" class="hidden subview"></div>

  <div class="sheet-backdrop" id="onboarding">
    <div class="sheet">
      <div class="drag-handle"></div>
      <h1 style="font-size:23px;font-weight:700;margin:0 0 4px;">Hvem er du her på vegne av?</h1>
      <p style="font-size:14px;color:var(--ink-soft);margin:0 0 18px;">Dette huskes til neste gang du åpner appen.</p>
      <button class="onboard-option press" data-profile="borettslag">
        <div class="icon-box"></div>
        <div><div class="label">Borettslag</div><div class="desc">Felles brannsikkerhet for hele bygget</div></div>
      </button>
      <button class="onboard-option press" data-profile="sameie">
        <div class="icon-box"></div>
        <div><div class="label">Sameie / velforening</div><div class="desc">Styret har ansvar for oppfølging</div></div>
      </button>
      <button class="onboard-option press" data-profile="privat">
        <div class="icon-box"></div>
        <div><div class="label">Privatperson</div><div class="desc">Egen bolig eller hytte</div></div>
      </button>
    </div>
  </div>

  <div class="sheet-backdrop" id="emergency" style="z-index:40;">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
        <div>
          <h1 style="font-size:22px;font-weight:700;margin:0;">Er det brann?</h1>
          <p style="font-size:13.5px;color:var(--ink-soft);margin:4px 0 0;">Ring 110 og del posisjonen din med nødetatene.</p>
        </div>
        <button class="icon-btn press" id="closeEmergency" style="width:30px;height:30px;flex-shrink:0;" aria-label="Lukk">✕</button>
      </div>
      <button id="callButton" class="press" style="margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;border:none;text-decoration:none;border-radius:14px;padding:16px 18px;font-size:19px;font-weight:700;cursor:pointer;">
        📞 Ring 110 nå
      </button>
      <button id="sharePosition" class="press" style="margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer;">
        📍 <span id="posLabel">Del posisjon med nødetatene</span>
      </button>
      <p style="font-size:12px;color:var(--grey);margin-top:12px;line-height:1.5;">I den ferdige appen sendes posisjon og adresse automatisk til nødsentralen sammen med samtalen.</p>
    </div>
  </div>

</div>

// ---------- state & storage ----------
const STORE_KEY = 'nb_app_state_v1';
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(!parsed.commonChecks){
        parsed.commonChecks = {
          brannslange: { lastChecked:'', ok:null, note:'' },
          escape: { lastChecked:'', ok:null, note:'' },
          storage: { lastChecked:'', ok:null, note:'' },
          escooter: { lastChecked:'', ok:null, note:'' },
        };
      }
      if(!parsed.powderExtinguishers){
        if(parsed.powder && (parsed.powder.lastFlipped || parsed.powder.pressureOk || parsed.powder.lastService)){
          parsed.powderExtinguishers = [{ id: uid(), name:'', lastFlipped: parsed.powder.lastFlipped||'', pressureOk: parsed.powder.pressureOk||null, lastService: parsed.powder.lastService||'' }];
        } else {
          parsed.powderExtinguishers = [];
        }
        delete parsed.powder;
      }
      return parsed;
    }
  }catch(e){}
  return {
    profileType: null,
    smokeDetectors: [],
    powderExtinguishers: [],
    blanket: { knows:null, location:'' },
    foam: { knows:null, location:'', purchased:'', expires:'' },
    commonChecks: {
      brannslange: { lastChecked:'', ok:null, note:'' },
      escape: { lastChecked:'', ok:null, note:'' },
      storage: { lastChecked:'', ok:null, note:'' },
      escooter: { lastChecked:'', ok:null, note:'' },
    },
  };
}
let state = loadState();
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

// ---------- helpers ----------
function uid(){ return Math.random().toString(36).slice(2,10); }
function fmtDate(iso){
  if(!iso) return 'Ikke satt';
  const p = iso.split('-');
  if(p.length!==3) return iso;
  return p[2]+'.'+p[1]+'.'+p[0];
}
function addYears(iso, years){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setFullYear(d.getFullYear()+years);
  return d.toISOString().slice(0,10);
}
function daysUntil(iso){
  const target = new Date(iso+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target.getTime()-now.getTime())/86400000);
}
function addMonths(iso, months){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
function statusFrom(iso){
  if(!iso) return {label:'Ikke satt', fg:'var(--grey)', bg:'var(--grey-bg)'};
  const d = daysUntil(iso);
  if(d<0) return {label:'Forfalt', fg:'var(--red)', bg:'#FBE7E7'};
  if(d<=30) return {label:'Snart', fg:'var(--amber)', bg:'var(--amber-bg)'};
  return {label:'OK', fg:'var(--green)', bg:'var(--green-bg)'};
}
function commonCheckStatus(c, months){
  if(c.ok==='nei') return {label:'Avvik', fg:'var(--red)', bg:'#FBE7E7'};
  if(!c.lastChecked) return {label:'Ikke sjekket', fg:'var(--grey)', bg:'var(--grey-bg)'};
  return statusFrom(addMonths(c.lastChecked, months));
}
function pillHtml(status){
  return '<span class="pill" style="color:'+status.fg+';background:'+status.bg+';">'+status.label+'</span>';
}
const PROFILE_LABEL = { borettslag:'Borettslag', sameie:'Sameie / velforening', privat:'Privatperson' };
const RESPONSIBILITY = {
  borettslag: 'Styret har ansvar for brannsikkerheten i fellesarealene.',

};

// ---------- render ----------
function showView(id){
  ['home','smoke','powder','blanket','foam','tips','common'].forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('hidden', v!==id);
  });
  render();
}
let currentView = 'home';
let activeCommonCheck = null;
function nav(id, param){ currentView = id; if(id==='common') activeCommonCheck = param; showView(id); }

function render(){
  if(currentView==='home') renderHome();
  if(currentView==='smoke') renderSmoke();
  if(currentView==='powder') renderPowder();
  if(currentView==='blanket') renderBlanket();
  if(currentView==='foam') renderFoam();
  if(currentView==='tips') renderTips();
  if(currentView==='common') renderCommon();

  document.getElementById('onboarding').classList.toggle('open', state.profileType==null);
}

function renderHome(){

    else if(statuses.some(s=>s.label==='Snart')) worstSmoke = 'En eller flere bør sjekkes snart';

function featureRow(icon, title, subtitle, navId, param, accent){
  return `<button class="${accent?'feature-row-accent':'feature-row'} press" data-nav="${navId}"${param?` data-param="${param}"`:''}>
    <div class="icon-box">${ICONS[icon]}</div>
    <div style="flex:1;min-width:0;">
      <div class="title">${title}</div>
      <div class="subtitle">${subtitle}</div>
    </div>
    <span style="color:${accent?'rgba(255,255,255,0.75)':'var(--grey)'};">${ICONS.chevronRight}</span>
  </button>`;
}
function sectionHeader(title){
  return `<div class="section-header">
    <button id="btnBack" class="icon-btn press" style="width:34px;height:34px;">${ICONS.chevronLeft}</button>
    <h2>${title}</h2>
  </div>`;
}

function renderSmoke(){
  const el = document.getElementById('view-smoke');
  const dets = state.smokeDetectors;
  el.innerHTML = sectionHeader('Røykvarslere') +
    `<p style="font-size:13.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:16px;">Registrer når du sist byttet batteri. Vi foreslår sjekk hvert år.</p>` +
    (dets.length===0 ? `<div class="card" style="text-align:center;color:var(--grey);font-size:13.5px;margin-bottom:14px;">Ingen røykvarslere lagt til enda.</div>` : '') +
    dets.map(d=>{
      const nextCheck = d.lastChanged ? addYears(d.lastChanged,1) : '';
      const status = statusFrom(nextCheck);
      return `<div class="card" style="margin-bottom:12px;" data-id="${d.id}">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;">
          <div style="display:flex;align-items:flex-end;gap:6px;flex:1;min-width:0;">
            <span style="color:var(--grey);flex-shrink:0;">${ICONS.pencil}</span>
            <input type="text" class="detector-name" data-field="name" value="${escapeAttr(d.name)}" placeholder="F.eks. Røykvarsler stue">
          </div>
          <button class="press btn-delete" style="border:none;background:transparent;cursor:pointer;padding:4px;color:var(--grey);">${ICONS.trash}</button>
        </div>
        <div style="margin-top:10px;">
          <div class="field">
            <div class="field-label">Sist byttet batteri</div>
            <input type="date" data-field="lastChanged" value="${d.lastChanged||''}">
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12.5px;color:var(--ink-soft);">Bør sjekkes: ${fmtDate(nextCheck)}</span>
          ${pillHtml(status)}
        </div>
      </div>`;
    }).join('') +
    `<button id="btnAddDetector" class="dashed-btn press">${ICONS.plus} Legg til røykvarsler</button>`;

  el.querySelector('#btnBack').onclick = ()=> nav('home');
  document.getElementById('btnAddDetector').onclick = ()=>{
    state.smokeDetectors.push({id:uid(), name:'', lastChanged:''});
    persist(); renderSmoke();
  };
  el.querySelectorAll('.card[data-id]').forEach(card=>{
    const id = card.getAttribute('data-id');
    card.querySelector('.btn-delete').onclick = ()=>{
      state.smokeDetectors = state.smokeDetectors.filter(d=>d.id!==id);
      persist(); renderSmoke();
    };
    card.querySelectorAll('[data-field]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const det = state.smokeDetectors.find(d=>d.id===id);
        det[inp.getAttribute('data-field')] = inp.value;
        persist(); renderSmoke();
      });
      inp.addEventListener('input', ()=>{
        if(inp.getAttribute('data-field')==='name'){
          const det = state.smokeDetectors.find(d=>d.id===id);
          det.name = inp.value; persist();
        }
      });
    });
  });
}

function renderPowder(){
  const el = document.getElementById('view-powder');
  const items = state.powderExtinguishers;
  el.innerHTML = sectionHeader('Pulverapparat') +
    `<p style="font-size:13.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:16px;">Registrer status på hvert apparat. Vi foreslår service hvert 5. år.</p>` +
    (items.length===0 ? `<div class="card" style="text-align:center;color:var(--grey);font-size:13.5px;margin-bottom:14px;">Ingen pulverapparat lagt til enda.</div>` : '') +
    items.map(p=>{
      const nextService = p.lastService ? addYears(p.lastService,5) : '';
      const status = statusFrom(nextService);
      return `<div class="card" style="margin-bottom:12px;" data-id="${p.id}">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px;">
          <div style="display:flex;align-items:flex-end;gap:6px;flex:1;min-width:0;">
            <span style="color:var(--grey);flex-shrink:0;">${ICONS.pencil}</span>
            <input type="text" class="detector-name" data-field="name" value="${escapeAttr(p.name)}" placeholder="F.eks. Pulverapparat gang">
          </div>
          <button class="press btn-delete" style="border:none;background:transparent;cursor:pointer;padding:4px;color:var(--grey);">${ICONS.trash}</button>
        </div>
        <div class="field">
          <div class="field-label">Når snudde du den sist?</div>
          <input type="date" data-field="lastFlipped" value="${p.lastFlipped||''}">

        <div class="field">
          <div class="field-label">Er trykket i orden?</div>
          <div class="toggle3 pPressure">
            <button data-val="ja" class="${p.pressureOk==='ja'?'active':''}">Ja</button>
            <button data-val="nei" class="${p.pressureOk==='nei'?'active':''}">Nei</button>
            <button data-val="usikker" class="${p.pressureOk==='usikker'?'active':''}">Usikker</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">Når var forrige service?</div>
          <input type="date" data-field="lastService" value="${p.lastService||''}">

        <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;">

            <div style="font-size:15px;font-weight:700;">${fmtDate(nextService)}</div>
          </div>
          ${pillHtml(status)}
        </div>
      </div>`;
    }).join('') +
    `<button id="btnAddPowder" class="dashed-btn press">${ICONS.plus} Legg til pulverapparat</button>

  el.querySelector('#btnBack').onclick = ()=> nav('home');
  document.getElementById('btnAddPowder').onclick = ()=>{
    state.powderExtinguishers.push({id:uid(), name:'', lastFlipped:'', pressureOk:null, lastService:''});
    persist(); renderPowder();
  };
  el.querySelectorAll('.card[data-id]').forEach(card=>{
    const id = card.getAttribute('data-id');
    const item = state.powderExtinguishers.find(x=>x.id===id);
    card.querySelector('.btn-delete').onclick = ()=>{
      state.powderExtinguishers = state.powderExtinguishers.filter(x=>x.id!==id);
      persist(); renderPowder();
    };
    card.querySelectorAll('[data-field]').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        item[inp.getAttribute('data-field')] = inp.value;
        persist(); renderPowder();
      });
      inp.addEventListener('input', ()=>{
        if(inp.getAttribute('data-field')==='name'){
          item.name = inp.value; persist();
        }
      });
    });
    card.querySelectorAll('.pPressure button').forEach(b=>{
      b.onclick = ()=>{ item.pressureOk = b.getAttribute('data-val'); persist(); renderPowder(); };
    });
  });
}

      <div class="toggle3" id="bKnows" style="margin-top:8px;">
        <button data-val="ja" class="${b.knows===true?'active':''}">Ja</button>
        <button data-val="nei" class="${b.knows===false?'active':''}">Nei</button>

      ${b.knows===true ? `<div class="field" style="margin-top:12px;">

      ${b.knows===false ? `<a href="https://norskbrannvern.no/nettbutikk/nyhet-brannteppe-120x120-silikonbelagt/" target="_blank" rel="noopener noreferrer" class="order-card" style="margin-top:12px;">

        <span style="color:var(--amber);">${ICONS.chevronRight}</span>
      </a>` : ''}
    </div>`;

  el.querySelector('#btnBack').onclick = ()=> nav('home');
  el.querySelectorAll('#bKnows button').forEach(btn=> btn.onclick = ()=>{ b.knows = btn.getAttribute('data-val')==='ja'; persist(); renderBlanket(); } );

function renderFoam(){
  const el = document.getElementById('view-foam');
  const f = state.foam;
  const status = statusFrom(f.expires);
  el.innerHTML = sectionHeader('Slokkeskum') +
    `<div class="card">
      <div class="field-label">Vet du hvor du har slokkeskummet ditt?</div>
      <div class="toggle3" id="fKnows" style="margin-top:8px;">
        <button data-val="ja" class="${f.knows===true?'active':''}">Ja</button>
        <button data-val="nei" class="${f.knows===false?'active':''}">Nei</button>
      </div>
      ${f.knows===true ? `<div class="field" style="margin-top:12px;">
        <div class="field-label">Hvor er det plassert?</div>
        <input type="text" id="fLocation" placeholder="F.eks. bod" value="${escapeAttr(f.location)}">
      </div>` : ''}
      ${f.knows===false ? `<a href="https://norskbrannvern.no/nettbutikk/110-slokkeskum-multipro/" target="_blank" rel="noopener noreferrer" class="order-card" style="margin-top:12px;">
        <div style="display:flex;align-items:center;gap:10px;color:var(--amber);">${ICONS.bag}<span>Bestill slokkeskum</span></div>
        <span style="color:var(--amber);">${ICONS.chevronRight}</span>
      </a>` : ''}
    </div>
    <div style="height:12px;"></div>
    <div class="card">
      <div class="field">
        <div class="field-label">Kjøpt</div>
        <input type="date" id="fPurchased" value="${f.purchased||''}">
      </div>
      <div class="field">
        <div class="field-label">Utløper</div>
        <input type="date" id="fExpires" value="${f.expires||''}">
      </div>
      ${(!f.expires && f.purchased) ? `<button id="fSuggest" class="link-btn press">Foreslå utløpsdato (kjøpt + 5 år)</button>` : ''}
      <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:13px;color:var(--ink-soft);">Bør byttes innen</div>
        ${pillHtml(status)}
      </div>
    </div>`;

  el.querySelector('#btnBack').onclick = ()=> nav('home');
  el.querySelectorAll('#fKnows button').forEach(btn=> btn.onclick = ()=>{ f.knows = btn.getAttribute('data-val')==='ja'; persist(); renderFoam(); } );
  const loc = document.getElementById('fLocation');
  if(loc) loc.oninput = ()=>{ f.location = loc.value; persist(); };
  document.getElementById('fPurchased').onchange = e=>{ f.purchased=e.target.value; persist(); renderFoam(); };
  document.getElementById('fExpires').onchange = e=>{ f.expires=e.target.value; persist(); renderFoam(); };
  const sug = document.getElementById('fSuggest');
  if(sug) sug.onclick = ()=>{ f.expires = addYears(f.purchased,5); persist(); renderFoam(); };
}

function renderCommon(){
  const el = document.getElementById('view-common');
  const cfg = COMMON_CHECKS.find(c=>c.key===activeCommonCheck);
  const c = state.commonChecks[cfg.key];
  const status = commonCheckStatus(c, cfg.months);
  el.innerHTML = sectionHeader(cfg.title) +
    `<p style="font-size:13.5px;color:var(--ink-soft);margin-top:-10px;margin-bottom:16px;">${cfg.desc}</p>` +
    `<div class="card">
      <div class="field">
        <div class="field-label">Sist sjekket</div>
        <input type="date" id="ccDate" value="${c.lastChecked||''}">
      </div>
      <div class="field">
        <div class="field-label">${cfg.question}</div>
        <div class="toggle3" id="ccOk">
          <button data-val="ja" class="${c.ok==='ja'?'active':''}">Ja</button>
          <button data-val="nei" class="${c.ok==='nei'?'active':''}">Nei</button>
          <button data-val="usikker" class="${c.ok==='usikker'?'active':''}">Usikker</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">Notat (valgfritt)</div>
        <input type="text" id="ccNote" placeholder="F.eks. hva som bør følges opp" value="${escapeAttr(c.note)}">
      </div>
      <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:13px;color:var(--ink-soft);">Status</div>
        ${pillHtml(status)}
      </div>
    </div>`;

  el.querySelector('#btnBack').onclick = ()=> nav('home');
  document.getElementById('ccDate').onchange = e=>{ c.lastChecked=e.target.value; persist(); renderCommon(); };
  document.getElementById('ccNote').oninput = e=>{ c.note=e.target.value; persist(); };
  el.querySelectorAll('#ccOk button').forEach(b=> b.onclick = ()=>{ c.ok = b.getAttribute('data-val'); persist(); renderCommon(); } );
}

function escapeAttr(s){
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
